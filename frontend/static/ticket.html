<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Queue Pass – QueueLess</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full space-y-4">
        <!-- Back Link & Header -->
        <div class="flex items-center justify-between px-2">
            <a href="/" class="text-xs font-semibold text-slate-500 hover:text-blue-600 flex items-center gap-1 transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Main Portal
            </a>
            <span class="text-[11px] font-bold text-slate-400 font-mono" id="ticketClock">--:--</span>
        </div>

        <!-- The Ticket Boarding Pass Card -->
        <div id="ticketContainer" class="token-card p-6 sm:p-8 bg-white">
            <div class="text-center py-12 text-slate-400">Loading your digital pass...</div>
        </div>

        <!-- Controls / Actions -->
        <div class="flex items-center justify-center gap-3 text-xs">
            <button onclick="window.print()" class="px-4 py-2 bg-white border border-slate-300 rounded-xl font-bold text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5 shadow-2xs">
                <i data-lucide="printer" class="w-4 h-4"></i> Print Pass
            </button>
            <button onclick="window.queueAudio.playChime()" class="px-4 py-2 bg-white border border-slate-300 rounded-xl font-bold text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5 shadow-2xs">
                <i data-lucide="bell" class="w-4 h-4 text-emerald-600"></i> Test Audio Chime
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/chime.js"></script>
    <script src="/static/js/websocket.js"></script>

    <script>
        function updateClock() {
            document.getElementById('ticketClock').textContent = new Date().toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        const urlParams = new URLSearchParams(window.location.search);
        const tokenNumber = urlParams.get('token') || localStorage.getItem('queueless_active_token') || 'ADM-101';

        async function loadTicket() {
            try {
                const res = await fetch(`/api/tokens/${tokenNumber}`);
                if (!res.ok) throw new Error("Ticket not found.");
                const tok = await res.json();
                renderPass(tok);
            } catch (e) {
                document.getElementById('ticketContainer').innerHTML = `
                    <div class="text-center py-10 text-red-500">
                        <i data-lucide="alert-circle" class="w-10 h-10 mx-auto mb-2"></i>
                        <p class="font-bold">${e.message}</p>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        function renderPass(tok) {
            const isCalled = tok.status === 'CALLED';
            const isServing = tok.status === 'SERVING';
            const est = tok.estimate || {};

            let statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-indigo-100 text-indigo-700 uppercase">WAITING</span>`;
            if (isCalled) {
                statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-red-100 text-red-700 uppercase animate-pulse border border-red-300">CALLED!</span>`;
                window.queueAudio.announce(tok.token_number, tok.counter_name || "Counter");
                confetti({ particleCount: 80 });
            } else if (isServing) {
                statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-blue-100 text-blue-700 uppercase">NOW SERVING</span>`;
            } else if (tok.status === 'COMPLETED') {
                statusBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-700 uppercase">COMPLETED</span>`;
            }

            document.getElementById('ticketContainer').innerHTML = `
                <div class="flex items-start justify-between gap-4 pb-4 border-b border-slate-100">
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest block">Digital Queue Pass</span>
                        <h2 class="font-extrabold text-slate-900 text-base">${tok.service_name}</h2>
                    </div>
                    ${statusBadge}
                </div>

                <div class="my-6 text-center">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-widest block mb-1">Your Token</span>
                    <div class="font-mono text-5xl font-black text-slate-900 tracking-tight">
                        ${tok.token_number}
                    </div>
                    ${tok.is_priority ? '<span class="inline-block mt-2 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800 border border-amber-300">★ Priority Fast-Track</span>' : ''}
                </div>

                ${tok.counter_name ? `
                <div class="p-4 rounded-2xl bg-red-600 text-white text-center shadow-lg mb-6 animate-bounce">
                    <span class="text-[10px] uppercase font-bold tracking-wider block">Please Proceed Immediately To</span>
                    <span class="text-2xl font-black block">${tok.counter_name}</span>
                    <span class="text-xs text-white/80">Operator: ${tok.operator_name || 'Staff'}</span>
                </div>
                ` : ''}

                <div class="grid grid-cols-3 gap-2 p-3.5 rounded-2xl bg-slate-50 border border-slate-100 text-center mb-6">
                    <div>
                        <span class="text-[9px] text-slate-400 uppercase font-bold block">Ahead</span>
                        <span class="text-xl font-black text-slate-800">${est.people_ahead !== undefined ? est.people_ahead : '-'}</span>
                    </div>
                    <div class="border-x border-slate-200">
                        <span class="text-[9px] text-slate-400 uppercase font-bold block">Est. Wait</span>
                        <span class="text-xl font-black text-blue-600">~${est.estimated_wait_mins !== undefined ? est.estimated_wait_mins : '-'}m</span>
                    </div>
                    <div>
                        <span class="text-[9px] text-slate-400 uppercase font-bold block">Turn</span>
                        <span class="text-xl font-black text-slate-800 font-mono">${est.expected_turn_time || '--:--'}</span>
                    </div>
                </div>

                <div class="token-perforation"></div>

                <div class="grid grid-cols-2 gap-3 text-xs pt-2">
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase">Passenger</span>
                        <span class="font-bold text-slate-900">${tok.customer_name}</span>
                    </div>
                    <div class="text-right">
                        <span class="text-slate-400 block text-[10px] uppercase">Issued</span>
                        <span class="font-mono text-slate-700">${tok.created_at.split(' ')[1]}</span>
                    </div>
                </div>

                <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
                    <div class="barcode-strip max-w-[160px]"></div>
                    <canvas id="qrCanvas" class="w-12 h-12 inline-block rounded border border-slate-200"></canvas>
                </div>
            `;

            setTimeout(() => {
                const canvas = document.getElementById('qrCanvas');
                if (canvas && window.QRCode) {
                    QRCode.toCanvas(canvas, window.location.href, { width: 48, margin: 1 });
                }
            }, 50);

            lucide.createIcons();
        }

        window.addEventListener('queueless:event', (e) => {
            loadTicket();
        });

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadTicket();
        });
    </script>
</body>
</html>
